# Blueprint do Render: https://render.com/docs/blueprint-spec
# Um Web Service Docker (Spring Boot) no plano Free.
# A plataforma injeta PORT; o application.yml já lê ${PORT:8080}.

services:
  - type: web
    name: portfolio-curricular-api
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    region: oregon
    buildFilter:
      paths:
        - backend/**
    envVars:
      - key: CORS_ALLOWED_ORIGINS
        value: "*"
