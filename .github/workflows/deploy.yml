name: Deploy frontend

on:
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend → Vercel
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      API_BASE_URL: ${{ vars.API_BASE_URL }}
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Conferir URL da API
        run: |
          set -euo pipefail
          if [ -z "${API_BASE_URL:-}" ]; then
            echo "Defina a variável de repositório API_BASE_URL com a URL da Render (ex.: https://seu-app.onrender.com)."
            echo "Painel Render → o serviço → copiar o domínio *.onrender.com"
            exit 1
          fi
          echo "API_BASE_URL=${API_BASE_URL}"

      - name: Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar Vercel CLI
        run: npm install -g vercel@48

      - name: Gravar URL da API no environment de produção
        run: node scripts/write-prod-env.mjs

      - name: Puxar configuração de produção
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Publicar produção
        run: |
          set -euo pipefail
          URL="$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})"
          echo "### Frontend (Vercel)" >> "$GITHUB_STEP_SUMMARY"
          echo "- URL: ${URL}" >> "$GITHUB_STEP_SUMMARY"
          echo "- API: ${API_BASE_URL}" >> "$GITHUB_STEP_SUMMARY"
